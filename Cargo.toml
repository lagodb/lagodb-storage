[package]
name = "lagodb-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["Robert Mu. https://github.com/robertmu"]
description = "Object-backed file storage service for LagoDB with local caching, staging, and a Unix-domain streaming protocol."
homepage = "https://github.com/lagodb/lagodb-storage"
repository = "https://github.com/lagodb/lagodb-storage"
readme = "README.md"
keywords = ["storage", "object-store", "cache"]
categories = ["network-programming", "filesystem"]
include = ["src/**/*", "src/*", "docs/**/*", "Cargo.toml", "LICENSE", "README.md"]


[lib]
doctest = false

[dependencies]
aws-config = "1.11.0"
aws-credential-types = "1.3.0"
aws-types = "1.5.0"
serde = { version = "1", features = ["derive"] }
arc-swap = "1"
byteorder = "1.4"
bytes = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "fs", "rt", "macros", "time"], default-features = false }
tracing = "0.1.31"
async-trait = "0.1.9"
futures = { version = "0.3", default-features = false, features = ["std", "alloc"] }
libc = "0.2"
object_store = { version = "0.13.2", features = ["aws", "gcp", "azure"] }
redb = "3.1.1"
thiserror = "2.0.18"
tokio-util = { version = "0.7", default-features = false }
url = "2.5.7"
uuid = { version = "1.16", features = ["v4"] }

[dev-dependencies]
aws-sdk-s3 = "1"
tempfile = "3"
testcontainers = { version = "0.27", features = ["http_wait_plain"] }

[[test]]
name = "e2e"
required-features = ["integration"]

[features]
integration = []
